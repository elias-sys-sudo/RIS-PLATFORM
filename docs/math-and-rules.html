<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RIS — Math & Business Rules Atlas</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root{
    --bg:#0a0e1c; --panel:#121830; --panel2:#1a2244; --line:#2a3360;
    --text:#e7ecff; --muted:#8a96c8;
    --math:#5cffd1; --rule:#ffb454;
    --math-bg:rgba(92,255,209,.08); --rule-bg:rgba(255,180,84,.08);
    --chip:#243056;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Inter,sans-serif;font-size:14px}
  header{padding:20px 28px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0f1530,#0a0e1c)}
  header h1{margin:0;font-size:20px}
  header .sub{color:var(--muted);font-size:12px;margin-top:4px}
  .stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 16px}
  .stat .n{font-size:22px;font-weight:700}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .stat.math .n{color:var(--math)}
  .stat.rule .n{color:var(--rule)}

  .toolbar{position:sticky;top:0;z-index:10;background:#0a0e1c;padding:14px 28px;
    border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;
    flex-wrap:wrap}
  input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:10px 14px;border-radius:8px;font-size:13px;width:280px;outline:none}
  input[type=text]:focus{border-color:var(--math)}
  .toggles{display:flex;gap:6px;flex-wrap:wrap}
  .tog{padding:7px 12px;border-radius:999px;background:var(--chip);color:var(--muted);
    font-size:11px;cursor:pointer;border:1px solid transparent;
    text-transform:uppercase;letter-spacing:.5px;user-select:none}
  .tog.active{background:linear-gradient(135deg,#3a4a8a,#243056);color:var(--text);
    border-color:var(--line)}
  .tog.math.active{color:var(--math);border-color:var(--math)}
  .tog.rule.active{color:var(--rule);border-color:var(--rule)}

  main{padding:20px 28px 60px}
  .module{margin-bottom:28px}
  .module h2{font-size:14px;color:var(--muted);text-transform:uppercase;
    letter-spacing:2px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .module h2 .count{background:var(--chip);color:var(--text);padding:2px 8px;
    border-radius:999px;font-size:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;border-left:4px solid var(--line);transition:transform .15s}
  .card.MATH{border-left-color:var(--math);background:linear-gradient(180deg,var(--math-bg),var(--panel) 30%)}
  .card.RULE{border-left-color:var(--rule);background:linear-gradient(180deg,var(--rule-bg),var(--panel) 30%)}
  .card:hover{transform:translateY(-2px)}
  .card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    margin-bottom:8px}
  .card .title{font-weight:600;font-size:13px;line-height:1.35}
  .card .badge{font-size:9px;padding:3px 7px;border-radius:4px;letter-spacing:1px;
    font-weight:700;flex-shrink:0}
  .card.MATH .badge{background:var(--math);color:#0a0e1c}
  .card.RULE .badge{background:var(--rule);color:#0a0e1c}
  .card .desc{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
  .card .formula{background:#070b18;border:1px solid var(--line);border-radius:6px;
    padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:11px;
    color:var(--text);overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .card .meta span{font-size:9px;background:#0d1428;border:1px solid var(--line);
    color:var(--muted);padding:2px 6px;border-radius:4px;font-family:ui-monospace,monospace}
  .empty{color:var(--muted);text-align:center;padding:60px;font-size:13px}
</style>
</head>
<body>

<header>
  <h1>RIS — Math &amp; Business Rules Atlas</h1>
  <div class="sub">Every formula and business rule across the 13 modules · grouped, searchable, filterable</div>
  <div class="stats">
    <div class="stat math"><div class="n" id="stat-math">0</div><div class="l">Math formulas</div></div>
    <div class="stat rule"><div class="n" id="stat-rule">0</div><div class="l">Business rules</div></div>
    <div class="stat"><div class="n" id="stat-mod">0</div><div class="l">Modules</div></div>
    <div class="stat"><div class="n" id="stat-shown">0</div><div class="l">Currently shown</div></div>
  </div>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="🔎 Search formulas, rules, files…" />
  <div class="toggles" id="cat-toggles">
    <div class="tog math active" data-cat="MATH">MATH</div>
    <div class="tog rule active" data-cat="RULE">RULE</div>
  </div>
  <div class="toggles" id="mod-toggles"></div>
</div>

<main id="main"></main>

const $ = id => document.getElementById(id);
const main = $("main");
const allMods = [...new Set(ITEMS.map(i=>i.mod))];
const activeCats = new Set(["MATH","RULE"]);
const activeMods = new Set(allMods);

// build module toggles
const modBox = $("mod-toggles");
allMods.forEach(m=>{
  const el = document.createElement("div");
  el.className = "tog active";
  el.dataset.mod = m;
  el.textContent = m;
  el.onclick = ()=>{
    if(activeMods.has(m)){activeMods.delete(m);el.classList.remove("active")}
    else{activeMods.add(m);el.classList.add("active")}
    render();
  };
  modBox.appendChild(el);
});

// category toggles
document.querySelectorAll("#cat-toggles .tog").forEach(el=>{
  el.onclick = ()=>{
    const c = el.dataset.cat;
    if(activeCats.has(c)){activeCats.delete(c);el.classList.remove("active")}
    else{activeCats.add(c);el.classList.add("active")}
    render();
  };
});

$("search").oninput = render;

function render(){
  const q = $("search").value.trim().toLowerCase();
  const filtered = ITEMS.filter(i =>
    activeCats.has(i.cat) &&
    activeMods.has(i.mod) &&
    (!q || (i.title+i.desc+i.formula+i.file+i.fn+i.mod).toLowerCase().includes(q))
  );
  const byMod = {};
  filtered.forEach(i=>{ (byMod[i.mod] ||= []).push(i); });

  main.innerHTML = "";
  if(filtered.length === 0){
    main.innerHTML = '<div class="empty">No matches. Try a different filter or search term.</div>';
  } else {
    Object.keys(byMod).sort().forEach(mod=>{
      const sec = document.createElement("section");
      sec.className = "module";
      sec.innerHTML = `<h2>${mod} <span class="count">${byMod[mod].length}</span></h2>
        <div class="grid">${byMod[mod].map(card).join("")}</div>`;
      main.appendChild(sec);
    });
  }
  $("stat-shown").textContent = filtered.length;
}

function card(i){
  return `<div class="card ${i.cat}">
    <div class="head">
      <div class="title">${escape(i.title)}</div>
      <div class="badge">${i.cat}</div>
    </div>
    <div class="desc">${escape(i.desc)}</div>
    <div class="formula">${escape(i.formula)}</div>
    <div class="meta">
      <span>${escape(i.file)}</span>
      <span>${escape(i.fn)}</span>
      <span>L${escape(i.lines)}</span>
    </div>
  </div>`;
}
function escape(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

$("stat-math").textContent = ITEMS.filter(i=>i.cat==="MATH").length;
$("stat-rule").textContent = ITEMS.filter(i=>i.cat==="RULE").length;
$("stat-mod").textContent = allMods.length;
render();
</script>
