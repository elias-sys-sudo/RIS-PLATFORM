server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    # frame-src 'self' blob: lets the KYC document preview dialog render
    # decrypted PDF blobs inside an <iframe>. Without this, default-src
    # falls through and the browser shows "This content is blocked".
    # frame-ancestors 'none' still prevents clickjacking on our pages —
    # frame-src and frame-ancestors are independent directives.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' /api; font-src 'self' data:; frame-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Cache: SPA entry (index.html) — always revalidate ────────────────────
    # index.html is served by `location /` (no own add_header, so it inherits
    # these server-level headers). Without no-cache, browsers heuristically
    # cache the entry point and keep loading the OLD hashed bundle (which is
    # immutable for 1y), so new deploys never reach returning users. no-cache
    # forces a conditional revalidation on every load; the hashed /assets below
    # stay immutable.
    add_header Cache-Control "no-cache" always;

    # ── Cache: hashed assets (1 year) ────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Cache: service worker (no cache) ─────────────────────────────────────
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Cache: manifest ──────────────────────────────────────────────────────
    location /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/manifest+json;
    gzip_min_length 1024;
}
