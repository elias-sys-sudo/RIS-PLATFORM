# =============================================================================
# RIS Platform — Nginx Reverse Proxy + TLS
#
# Two server blocks:
#   :80   — ACME HTTP-01 challenge passthrough + 301 redirect everything else
#           to HTTPS. Required because Let's Encrypt validates domain control
#           by hitting http://<host>/.well-known/acme-challenge/<token> over
#           port 80. After the cert is issued, no real traffic touches :80.
#   :443  — TLS termination + reverse proxy to ris-api / ris-frontend.
#
# TLS configuration follows Mozilla's "Intermediate" profile (≈ 99% browser
# compatibility, no SSLv3/TLSv1/TLSv1.1, no RC4, no CBC ciphers under TLS1.2).
# HSTS pinned for 6 months with includeSubDomains. OCSP stapling on.
#
# Cert paths assume certbot writes to /etc/letsencrypt mounted into nginx at
# the same path. STAGING_DOMAIN env is interpolated by envsubst (see
# docker-compose.production.yml `command:` for nginx).
# =============================================================================

upstream ris_api {
    server ris-api:4000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

# ── :80 — ACME challenge + permanent HTTPS redirect ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ${STAGING_DOMAIN};

    # Let's Encrypt webroot challenge — must stay on :80 for HTTP-01 to work.
    # Certbot writes one-shot tokens to /var/www/certbot/.well-known/acme-challenge/
    # at renewal time; nginx serves them with no TLS so Let's Encrypt servers
    # can read them and verify domain ownership.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else → 301 to HTTPS. Even /api/health: we want the smoke test
    # to follow the redirect (curl -L) and hit TLS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── :443 — TLS termination + reverse proxy ──────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${STAGING_DOMAIN};

    # ── TLS cert (from Let's Encrypt via certbot sidecar) ───────────────────
    ssl_certificate     /etc/letsencrypt/live/${STAGING_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${STAGING_DOMAIN}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${STAGING_DOMAIN}/chain.pem;

    # ── Mozilla Intermediate (2025) ─────────────────────────────────────────
    # https://ssl-config.mozilla.org/#server=nginx&version=1.27&config=intermediate
    ssl_session_timeout 1d;
    ssl_session_cache shared:RisSSL:50m;  # 50MB ≈ 200k sessions
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # ── OCSP stapling ───────────────────────────────────────────────────────
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ────────────────────────────────────────────────────
    # HSTS: 6 months. Bump to 31536000 (1 year) once TLS has been stable on
    # production for ≥30 days, then submit to https://hstspreload.org/.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-XSS-Protection deprecated in favor of CSP; remove once CSP is in place.
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/ris_access.log;
    error_log  /var/log/nginx/ris_error.log warn;

    # Max upload size (invoices, documents)
    client_max_body_size 10m;

    # ── Backend API: /api/auth/* → backend /auth/* (tighter rate limit) ─────
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://ris_api;
        include /etc/nginx/proxy_params.conf;
    }

    # ── Backend API: /api/* → backend /* (strip /api prefix) ────────────────
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://ris_api;
        include /etc/nginx/proxy_params.conf;
    }

    # ── Health check (direct, no /api prefix) — used by Stage 7 smoke ───────
    location /health {
        proxy_pass http://ris_api/health;
        include /etc/nginx/proxy_params.conf;
    }

    # ── Frontend (React SPA) ────────────────────────────────────────────────
    location / {
        proxy_pass http://ris-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Block access to dotfiles (but allow .well-known via :80 only)
    location ~ /\. {
        deny all;
        return 404;
    }
}
