version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ris-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ris_platform
      POSTGRES_USER: ris_user
      POSTGRES_PASSWORD: ris_dev_password
    volumes:
      - ris-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ris_user -d ris_platform']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ris-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ris-pgdata:
